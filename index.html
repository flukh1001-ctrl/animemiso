    /* ===== ระบบสีธีม: ตัวแปรสี (purple=สีหลัก, pink=สีรอง, gray=พื้น/ตัวอักษร) ===== */
    const PAL = {
      purple:{50:'250 245 255',100:'243 232 255',200:'233 213 255',300:'216 180 254',400:'192 132 252',500:'168 85 247',600:'147 51 234',700:'126 34 206',800:'107 33 168',900:'88 28 135',950:'59 7 100'},
      pink:{50:'253 242 248',100:'252 231 243',200:'251 207 232',300:'249 168 212',400:'244 114 182',500:'236 72 153',600:'219 39 119',700:'190 24 93',800:'157 23 77',900:'131 24 67',950:'80 7 36'},
      blue:{50:'239 246 255',100:'219 234 254',200:'191 219 254',300:'147 197 253',400:'96 165 250',500:'59 130 246',600:'37 99 235',700:'29 78 216',800:'30 64 175',900:'30 58 138',950:'23 37 84'},
      cyan:{50:'236 254 255',100:'207 250 254',200:'165 243 252',300:'103 232 249',400:'34 211 238',500:'6 182 212',600:'8 145 178',700:'14 116 144',800:'21 94 117',900:'22 78 99',950:'8 51 68'},
      red:{50:'254 242 242',100:'254 226 226',200:'254 202 202',300:'252 165 165',400:'248 113 113',500:'239 68 68',600:'220 38 38',700:'185 28 28',800:'153 27 27',900:'127 29 29',950:'69 10 10'},
      orange:{50:'255 247 237',100:'255 237 213',200:'254 215 170',300:'253 186 116',400:'251 146 60',500:'249 115 22',600:'234 88 12',700:'194 65 12',800:'154 52 18',900:'124 45 18',950:'67 20 7'},
      green:{50:'240 253 244',100:'220 252 231',200:'187 247 208',300:'134 239 172',400:'74 222 128',500:'34 197 94',600:'22 163 74',700:'21 128 61',800:'22 101 52',900:'20 83 45',950:'5 46 22'},
      teal:{50:'240 253 250',100:'204 251 241',200:'153 246 228',300:'94 234 212',400:'45 212 191',500:'20 184 166',600:'13 148 136',700:'15 118 110',800:'17 94 89',900:'19 78 74',950:'4 47 46'},
      indigo:{50:'238 242 255',100:'224 231 255',200:'199 210 254',300:'165 180 252',400:'129 140 248',500:'99 102 241',600:'79 70 229',700:'67 56 202',800:'55 48 163',900:'49 46 129',950:'30 27 75'},
      gray:{50:'249 250 251',100:'243 244 246',200:'229 231 235',300:'209 213 219',400:'156 163 175',500:'107 114 128',600:'75 85 99',700:'55 65 81',800:'31 41 55',900:'17 24 39',950:'3 7 18'}
    };
    const THEMES = { purple:['purple','pink'], blue:['blue','cyan'], red:['red','orange'], green:['green','teal'], pink:['pink','purple'], white:['blue','indigo'] };
    const INV = {50:950,100:900,200:800,300:700,400:600,500:500,600:600,700:400,800:300,900:200,950:100};
    function applyTheme(name) {
      if (!THEMES[name]) name = 'purple';
      const light = name === 'white', root = document.documentElement.style;
      const set = (prefix, pal, invert) => { for (const n in PAL[pal]) root.setProperty('--' + prefix + '-' + n, PAL[pal][invert ? INV[n] : n]); };
      set('p', THEMES[name][0], light); set('s', THEMES[name][1], light);
      for (const n in PAL.gray) root.setProperty('--g-' + n, PAL.gray[light ? INV[n] : n]);
      root.setProperty('--bg', light ? '241 243 248' : '11 11 14');
      root.setProperty('--card', light ? '255 255 255' : '20 20 25');
      document.documentElement.dataset.theme = name;
      document.documentElement.style.colorScheme = light ? 'light' : 'dark';
      return name;
    }
    let currentTheme = 'purple';
    try { currentTheme = localStorage.getItem('am_theme') || 'purple'; } catch (e) {}
    currentTheme = applyTheme(currentTheme);
    const sc = p => Object.fromEntries([50,100,200,300,400,500,600,700,800,900,950].map(n => [n, 'rgb(var(--' + p + '-' + n + ') / <alpha-value>)']));
    tailwind.config = { theme: { extend: { colors: { purple: sc('p'), pink: sc('s'), gray: sc('g') } } } };
  </script>

    function renderTools() {
      const tabs = ['all','dl','create','tools'];
      document.getElementById('toolTabs').innerHTML = tabs.map(k =>
        `<button onclick="setToolFilter('${k}')" class="shrink-0 flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs font-bold border transition ${k === toolFilter ? 'bg-purple-600/30 border-purple-500/60 text-gray-100' : 'border-transparent text-gray-400 hover:text-gray-100'}"><i class="fa-solid ${TAB_ICON[k]}"></i><span>${t(k === 'all' ? 'tab_all' : CAT_LABEL[k])}</span></button>`).join('');
      const list = TOOLS.filter(x => toolFilter === 'all' || x.cat === toolFilter);
      const shown = toolExpanded ? list : list.slice(0, PAGE);
      document.getElementById('toolCount').textContent = list.length;
      document.getElementById('toolGrid').innerHTML = shown.map(x => {
        const live = !!x.u, tag = live ? 'a' : 'div';
        const attrs = live ? `href="${x.u}" target="_blank" rel="noopener noreferrer"` : '';
        return `<${tag} ${attrs} class="fade-in relative p-3 rounded-2xl border border-gray-800/80 bg-gradient-to-br from-${x.c}-600/15 to-transparent flex flex-col justify-between min-h-[124px] ${live ? 'glow-card cursor-pointer' : ''}">
          <div class="flex items-start justify-between">
            <div class="w-9 h-9 rounded-xl bg-${x.c}-600/20 text-${x.c}-400 border border-${x.c}-500/30 flex items-center justify-center"><i class="fa-solid ${x.i} text-sm"></i></div>
            <span class="text-[8px] font-bold px-1.5 py-0.5 rounded-md bg-gray-800/80 text-gray-300 border border-gray-700/70 whitespace-nowrap">${t(x.b || CAT_LABEL[x.cat])}</span>
          </div>
          <div class="mt-3">
            <h4 class="text-[11px] font-bold text-gray-100 leading-tight mb-1.5">${x.raw ? x.n : t(x.n)}</h4>
            <span class="inline-block text-[9px] font-bold px-2 py-0.5 rounded-full border ${live ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/40' : 'text-amber-400 bg-amber-500/10 border-amber-500/40'}">${t(live ? 'st_live' : 'st_soon')}</span>
          </div></${tag}>`;
      }).join('');
      const more = document.getElementById('toolMore'), rest = list.length - PAGE;
      if (rest > 0) {
        more.classList.remove('hidden'); more.classList.add('flex');
        more.innerHTML = toolExpanded ? `<i class="fa-solid fa-minus"></i><span>${t('less')}</span>` : `<i class="fa-solid fa-plus"></i><span>${t('more').replace('{n}', rest)}</span>`;
      } else { more.classList.add('hidden'); more.classList.remove('flex'); }
    }
    function setToolFilter(k) { toolFilter = k; toolExpanded = false; renderTools(); }
    function toggleMoreTools() { toolExpanded = !toolExpanded; renderTools(); }

    /* ===== เครื่องเล่นเพลง ===== */
    const playlist = ['song1.mp3','song2.mp3','song3.mp3'];
    let currentSongIndex = 0;
    const audioPlayer = document.getElementById('audioPlayer'), playBtn = document.getElementById('playBtn'), songTitle = document.getElementById('songTitle');
    function togglePlay() {
      if (audioPlayer.paused) { audioPlayer.play().catch(() => {}); playBtn.innerText = 'PAUSE'; }
      else { audioPlayer.pause(); playBtn.innerText = 'PLAY'; }
    }
    function nextSong() {
      currentSongIndex = (currentSongIndex + 1) % playlist.length;
      audioPlayer.src = playlist[currentSongIndex]; songTitle.innerText = playlist[currentSongIndex];
      audioPlayer.play().catch(() => {}); playBtn.innerText = 'PAUSE';
    }
    audioPlayer.onended = nextSong;

    /* ===== แท็บ ===== */
    function switchTab(tab) {
      const home = tab === 'home';
      document.getElementById('homeView').classList.toggle('hidden', !home);
      document.getElementById('animeView').classList.toggle('hidden', home);
      const on = 'text-purple-400 font-bold', off = 'text-gray-400';
      [['navHome', home], ['navAnime', !home]].forEach(([id, active]) => {
        const b = document.getElementById(id);
        b.classList.remove(...on.split(' '), off); b.classList.add(...(active ? on : off).split(' '));
        b.querySelector('div').className = 'p-1 rounded-xl ' + (active ? 'bg-purple-600/20 text-purple-400 shadow' : '');
      });
      window.scrollTo({ top: 0 });
    }

    /* ===== ยืนยันอายุ 18+ (Alpha-hen) ===== */
    function openAgeGate(e) { if (e) e.preventDefault(); const g = document.getElementById('ageGate'); g.classList.remove('hidden'); g.classList.add('flex'); }
    function confirmAge(ok) {
      const g = document.getElementById('ageGate'); g.classList.add('hidden'); g.classList.remove('flex');
      if (ok) window.location.href = 'https://www.alpha-hen.com/'; else window.scrollTo({ top: 0, behavior: 'smooth' });
    }


    /* ===== ระบบสมัคร / เข้าสู่ระบบ =====
       ถ้าวาง FIREBASE_CONFIG จะใช้ Firebase Authentication (บัญชีใช้ได้ทุกเครื่อง ปลอดภัยจริง)
       ถ้าเป็น null จะเก็บบัญชีไว้ในเบราว์เซอร์เครื่องนั้นเท่านั้น (โหมดทดลอง) */
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBCBXWsqF41HJpWhgpVY1UZbz_-Wp_Bsvo",
      authDomain: "animemiso.firebaseapp.com",
      projectId: "animemiso",
      storageBucket: "animemiso.firebasestorage.app",
      messagingSenderId: "888430543869",
      appId: "1:888430543869:web:e82c6bbac72eb7fe428f94",
      measurementId: "G-MVQZVHKCQ5"
    };

    async function sha256(s) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function lsGet(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }
    function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

    async function initAuth() {
      if (FIREBASE_CONFIG) {
        const V = '10.12.2', base = 'https://www.gstatic.com/firebasejs/' + V + '/';
        const { initializeApp } = await import(base + 'firebase-app.js');
        const A = await import(base + 'firebase-auth.js');
        const auth = A.getAuth(initializeApp(FIREBASE_CONFIG));
        const map = c => ({ 'auth/email-already-in-use':'exists','auth/invalid-credential':'wrong','auth/wrong-password':'wrong','auth/user-not-found':'wrong','auth/invalid-login-credentials':'wrong','auth/weak-password':'short','auth/invalid-email':'email' }[c] || 'generic');
        const wrap = p => p.catch(e => { throw { code: map(e.code) }; });
        return {
          signUp: (e, p) => wrap(A.createUserWithEmailAndPassword(auth, e, p)),
          signIn: (e, p) => wrap(A.signInWithEmailAndPassword(auth, e, p)),
          signOut: () => A.signOut(auth),
          onChange: cb => A.onAuthStateChanged(auth, u => cb(u ? u.email : null))
        };
      }
      let listener = () => {};
      const setSession = em => { lsSet('am_session', em); listener(em); };
      return {
        async signUp(email, pass) {
          const users = lsGet('am_users', {}), key = email.toLowerCase();
          if (users[key]) throw { code: 'exists' };
          const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
          users[key] = { salt, hash: await sha256(salt + pass) };
          lsSet('am_users', users); setSession(key);
        },
        async signIn(email, pass) {
          const u = lsGet('am_users', {})[email.toLowerCase()];
          if (!u || u.hash !== await sha256(u.salt + pass)) throw { code: 'wrong' };
          setSession(email.toLowerCase());
        },
        async signOut() { setSession(null); },
        onChange(cb) { listener = cb; cb(lsGet('am_session', null)); }
      };
    }

    let Auth = null, authMode = 'login', authErrKey = null;
    function renderAuth() {
      const login = authMode === 'login';
      const on = 'bg-purple-600/30 text-gray-100 border border-purple-500/50', off = 'text-gray-400 border border-transparent';
      document.getElementById('tabLogin').className = 'py-2.5 rounded-xl text-xs font-bold transition ' + (login ? on : off);
      document.getElementById('tabSignup').className = 'py-2.5 rounded-xl text-xs font-bold transition ' + (login ? off : on);
      document.getElementById('authTitle').textContent = t(login ? 'auth_title_login' : 'auth_title_signup');
      document.getElementById('authSubmit').textContent = t(login ? 'auth_btn_login' : 'auth_btn_signup');
      document.getElementById('authSwitchText').textContent = t(login ? 'auth_no_acc' : 'auth_have_acc');
      document.getElementById('authSwitchBtn').textContent = t(login ? 'auth_signup' : 'auth_login');
      document.getElementById('pass2Wrap').classList.toggle('hidden', login);
      document.getElementById('authPass').autocomplete = login ? 'current-password' : 'new-password';
      const er = document.getElementById('authError');
      if (authErrKey) { er.textContent = t(authErrKey); er.classList.remove('hidden'); } else er.classList.add('hidden');
    }
    function setAuthMode(m) { authMode = m; authErrKey = null; document.getElementById('authPass2').value = ''; renderAuth(); }
    function togglePass() {
      const i = document.getElementById('authPass'), show = i.type === 'password';
      i.type = show ? 'text' : 'password';
      document.getElementById('authPass2').type = show ? 'text' : 'password';
      document.getElementById('passEye').className = 'fa-solid text-xs ' + (show ? 'fa-eye-slash' : 'fa-eye');
    }
    async function submitAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim(), pass = document.getElementById('authPass').value;
      const signup = authMode === 'signup';
      const fail = k => { authErrKey = k; renderAuth(); };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('err_email');
      if (signup && pass.length < 6) return fail('err_short');
      if (signup && pass !== document.getElementById('authPass2').value) return fail('err_match');
      if (!pass) return fail('err_wrong');
      const btn = document.getElementById('authSubmit'); btn.disabled = true;
      btn.innerHTML = '<span class="inline-block w-4 h-4 mr-2 align-middle border-2 border-white/40 border-t-white rounded-full animate-spin"></span>' + t(signup ? 'auth_btn_signup' : 'auth_btn_login');
      try {
        if (!Auth) Auth = await initAuth();
        await (signup ? Auth.signUp(email, pass) : Auth.signIn(email, pass));
        authErrKey = null; document.getElementById('authPass').value = ''; document.getElementById('authPass2').value = '';
      } catch (err) { fail('err_' + ((err && err.code) || 'generic')); }
      btn.disabled = false; renderAuth();
    }
    function showApp(loggedIn) {
      document.getElementById('authView').classList.toggle('hidden', loggedIn);
      const lo = document.getElementById('logoutBtn');
      lo.classList.toggle('hidden', !loggedIn); lo.classList.toggle('flex', loggedIn);
      if (loggedIn) window.scrollTo({ top: 0 });
    }
    async function doLogout() { try { audioPlayer.pause(); playBtn.innerText = 'PLAY'; } catch (e) {} if (Auth) await Auth.signOut(); }

    /* ===== หน้าโหลด: ตอนเปิดเว็บ / หลังล็อกอิน / หลังออกจากระบบ ===== */
    const splashEl = document.getElementById('splash'), splashBar = document.getElementById('splashBar');
    let splashTimer = null;
    function runBar(ms) {
      splashBar.style.transition = 'none'; splashBar.style.width = '0';
      void splashBar.offsetWidth;
      splashBar.style.transition = 'width ' + ms + 'ms cubic-bezier(.2,.7,.3,1)'; splashBar.style.width = '100%';
    }
    function hideSplash() {
      splashEl.style.opacity = '0'; splashEl.style.pointerEvents = 'none';
      setTimeout(() => { splashEl.style.display = 'none'; }, 500);
    }
    function showSplash(ms, midAction) {
      clearTimeout(splashTimer);
      splashEl.style.display = 'flex'; void splashEl.offsetWidth;
      splashEl.style.opacity = '1'; splashEl.style.pointerEvents = 'auto';
      runBar(ms);
      splashTimer = setTimeout(() => { if (midAction) midAction(); hideSplash(); }, ms);
    }
    let authReady = false, minDone = false, firstAuth = true;
    function tryFinishInitial() { if (authReady && minDone) hideSplash(); }
    runBar(1600);
    setTimeout(() => { minDone = true; tryFinishInitial(); }, 1600);
    setTimeout(() => { authReady = true; tryFinishInitial(); }, 7000); // กันค้างถ้าเน็ตช้า/เชื่อมไม่ได้
    initAuth().then(a => {
      Auth = a;
      Auth.onChange(em => {
        if (firstAuth) { firstAuth = false; showApp(!!em); if (!em) setAuthMode('login'); authReady = true; tryFinishInitial(); return; }
        if (em) showSplash(1500, () => showApp(true));
        else showSplash(700, () => { showApp(false); setAuthMode('login'); });
      });
    }).catch(() => { authReady = true; tryFinishInitial(); });

    switchTab('home');
    applyLang();
  </script>
